<head>
    <meta charset="UTF-8">

    <title>Join for FFACF jr.html</title>
</head>
<body>
<h1 class="h1">Join us today!</h1>
<b><h1 class="descriptionmainlogo">Friends for a cause foundation jr. club</h1></b>
<img src="https://www.friendsforcause.org/assets/ffcf-logo-qT0smtGd.png" alt="Friends for a cause foundation logo" class="Mainlogo">
<input  id="name" type="text" placeholder="Name"><br>
<input  id="email" type="email" placeholder="Email">
<input id="submitBtn" class="submitbtn" type="submit" value="Submit" onclick="saveEmail()">
<br>
<br>
<p id="afterSubmit"></p>
</body>
</html>
<script>
function saveEmail() {
    if (!document.getElementById("name").value || !document.getElementById("email").value) {
        document.getElementById("afterSubmit").innerText = "Please fill in both fields.";
        return;
    }
    else {
        document.getElementById("afterSubmit").innerText = "";
        const checkemail = localStorage.getItem("email")||"";
    const email = document.getElementById("email").value;
    localStorage.setItem("email", email);
    const theyname = document.getElementById("name").value;
    localStorage.setItem("name", theyname);
    document.getElementById("afterSubmit").innerText = "Thank you " + theyname + ", we will contact you through your email once recived may take a few days.";
    }
}
</script>
